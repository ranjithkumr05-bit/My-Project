apiVersion: apps/v1
kind: Deployment
metadata:
  name: customwear
  labels:
    app: customwear
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customwear
  template:
    metadata:
      labels:
        app: customwear
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: customwear:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4300
          envFrom:
            - configMapRef:
                name: customwear-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4300
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4300
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
